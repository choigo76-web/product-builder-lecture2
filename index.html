<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 5세트 추천기</title>

  <style>
    :root {
      --color-1: #fbc400; /* 1-10 */
      --color-2: #69c8f2; /* 11-20 */
      --color-3: #ff7272; /* 21-30 */
      --color-4: #aaaaaa; /* 31-40 */
      --color-5: #7bc043; /* 41-45 */
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      width: 95%;
      max-width: 600px;
      padding: 40px 20px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 800;
      color: #2d3436;
    }

    #result {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .lotto-set {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 20px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.5s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .set-label {
      font-size: 14px;
      font-weight: bold;
      color: #636e72;
      margin-bottom: 10px;
    }

    .numbers {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ball {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .ball:hover {
      transform: scale(1.1);
    }

    .btn-generate {
      margin-top: 30px;
      background: #00b894;
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 184, 148, 0.3);
      transition: all 0.3s ease;
    }

    .btn-generate:hover {
      background: #00a884;
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(0, 184, 148, 0.4);
    }

    .btn-generate:active {
      transform: translateY(-1px);
    }

    .info {
      margin-top: 20px;
      font-size: 13px;
      color: #b2bec3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎰 로또 번호 5세트 생성기</h1>
    
    <div id="result">
      <!-- 로또 번호 세트가 여기에 생성됩니다 -->
    </div>

    <button class="btn-generate" onclick="generateAllSets()">
      새로운 번호 추천받기
    </button>

    <p class="info">버튼을 클릭하면 행운의 번호 5세트가 생성됩니다!</p>
  </div>

  <script>
    function getBallColor(num) {
      if (num <= 10) return "var(--color-1)";
      if (num <= 20) return "var(--color-2)";
      if (num <= 30) return "var(--color-3)";
      if (num <= 40) return "var(--color-4)";
      return "var(--color-5)";
    }

    function generateLottoNumbers() {
      const nums = new Set();
      while(nums.size < 6) {
        nums.add(Math.floor(Math.random() * 45) + 1);
      }
      return Array.from(nums).sort((a, b) => a - b);
    }

    function generateAllSets() {
      const resultContainer = document.getElementById('result');
      resultContainer.innerHTML = ''; // 기존 결과 삭제

      for (let i = 1; i <= 5; i++) {
        const numbers = generateLottoNumbers();
        const setDiv = document.createElement('div');
        setDiv.className = 'lotto-set';
        setDiv.style.animationDelay = `${(i - 1) * 0.1}s`;

        const label = document.createElement('div');
        label.className = 'set-label';
        label.innerText = `SET ${i}`;
        
        const numbersDiv = document.createElement('div');
        numbersDiv.className = 'numbers';

        numbers.forEach(num => {
          const ball = document.createElement('div');
          ball.className = 'ball';
          ball.style.backgroundColor = getBallColor(num);
          ball.innerText = num;
          numbersDiv.appendChild(ball);
        });

        setDiv.appendChild(label);
        setDiv.appendChild(numbersDiv);
        resultContainer.appendChild(setDiv);
      }
    }

    // 페이지 로드시 자동으로 첫 세트 생성
    window.onload = generateAllSets;
  </script>
</body>
</html>
